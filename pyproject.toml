[project]
name = "mealforge"
version = "0.1.0"
description = "AI-powered meal planning platform"
# 上界 <3.13 是刻意的: 本地 / CI / Docker 三处必须解析出同一棵依赖树。
# 只写下界时 uv 会挑系统最新版(曾解析到 3.14.5), 并在 uv.lock 中生成
# 3.14 与 3.12 两套 resolution-markers, 导致 C 扩展依赖(asyncpg /
# pydantic-core / sqlalchemy / cryptography)在不同环境装的是不同二进制。
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "pyjwt[crypto]>=2.13.0",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 依赖注入依赖 Depends() 作为默认值, 是框架标准写法(官方建议忽略)
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/*/seed_*.py",          # 一次性种子脚本, 不计入
    "app/*/__init__.py",
]

[tool.coverage.report]
# 排除无需测的行(如 TYPE_CHECKING 块)
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]